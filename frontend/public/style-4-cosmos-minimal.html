<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KORD — Style 4: Cosmos Minimal</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a12;
    --surface: rgba(255,255,255,0.025);
    --border: rgba(255,255,255,0.06);
    --indigo: #818cf8;
    --purple: #a78bfa;
    --rose: #fb7185;
    --text: #f1f1f8;
    --text-dim: rgba(241,241,248,0.4);
  }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Star field background */
  .stars {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    overflow: hidden;
  }
  .star {
    position: absolute; width: 2px; height: 2px; border-radius: 50%;
    background: white;
    animation: twinkle ease-in-out infinite alternate;
  }
  @keyframes twinkle {
    0% { opacity: 0.1; transform: scale(0.8); }
    100% { opacity: 0.7; transform: scale(1.2); }
  }

  /* Gradient orbs */
  .orb-1 {
    position: fixed; top: 10%; left: 50%; transform: translateX(-50%);
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(129,140,248,0.06) 0%, transparent 60%);
    pointer-events: none; z-index: 0;
    animation: orb-breathe 8s ease-in-out infinite;
  }
  .orb-2 {
    position: fixed; bottom: -20%; left: 20%;
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(167,139,250,0.04) 0%, transparent 60%);
    pointer-events: none; z-index: 0;
    animation: orb-breathe 12s ease-in-out infinite reverse;
  }
  @keyframes orb-breathe {
    0%, 100% { transform: translateX(-50%) scale(1); }
    50% { transform: translateX(-50%) scale(1.15); }
  }

  /* Nav */
  nav {
    position: sticky; top: 0; z-index: 20;
    border-bottom: 1px solid var(--border);
    background: rgba(10,10,18,0.85);
    backdrop-filter: blur(20px);
  }
  .nav-inner {
    max-width: 900px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 24px;
  }
  .logo {
    display: flex; align-items: center; gap: 10px;
    text-decoration: none; color: var(--text);
  }
  .logo-ring {
    width: 30px; height: 30px; border-radius: 50%;
    border: 1.5px solid rgba(129,140,248,0.4);
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .logo-ring::before {
    content: ''; position: absolute; inset: 3px; border-radius: 50%;
    background: linear-gradient(135deg, var(--indigo), var(--purple));
    opacity: 0.15;
  }
  .logo-ring svg { position: relative; z-index: 1; }
  .logo span {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px; font-weight: 700; letter-spacing: 0.18em;
  }
  .nav-right { font-size: 10px; font-weight: 500; color: var(--text-dim); letter-spacing: 0.15em; text-transform: uppercase; }

  /* Main — everything centered, very minimal */
  main {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center;
    padding: 0 20px;
    min-height: calc(100vh - 57px);
    gap: 40px;
  }

  /* Card — single floating card in center */
  .master-card {
    width: 100%; max-width: 520px;
    border: 1px solid var(--border);
    border-radius: 28px;
    background: rgba(255,255,255,0.025);
    backdrop-filter: blur(12px);
    padding: 48px 40px;
    text-align: center;
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 80px rgba(129,140,248,0.05);
  }
  /* Subtle gradient line at top */
  .master-card::before {
    content: ''; position: absolute; top: 0; left: 20%; right: 20%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--indigo), var(--purple), transparent);
    opacity: 0.5;
  }

  .master-card .tag {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 14px; border-radius: 9999px;
    border: 1px solid rgba(129,140,248,0.2);
    background: rgba(129,140,248,0.05);
    font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.2em; color: var(--indigo);
    margin-bottom: 24px;
  }
  .master-card h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 32px; font-weight: 700; line-height: 1.25;
    margin-bottom: 8px;
  }
  .master-card h1 .cosmos {
    background: linear-gradient(135deg, var(--indigo), var(--rose), var(--purple));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .master-card .subtitle {
    font-size: 13px; color: var(--text-dim); line-height: 1.7;
    margin-bottom: 32px;
    max-width: 380px; margin-left: auto; margin-right: auto;
  }

  /* Drop zone inside card */
  .drop-zone {
    border: 2px dashed rgba(129,140,248,0.15);
    border-radius: 20px;
    background: rgba(129,140,248,0.02);
    cursor: pointer;
    transition: all 0.35s;
    padding: 36px 20px;
    margin-bottom: 24px;
  }
  .drop-zone:hover {
    border-color: rgba(129,140,248,0.35);
    background: rgba(129,140,248,0.04);
    box-shadow: 0 0 40px rgba(129,140,248,0.06);
  }
  .drop-zone.drag-over {
    border-color: var(--indigo);
    background: rgba(129,140,248,0.06);
    box-shadow: 0 0 60px rgba(129,140,248,0.12);
  }

  .drop-icon {
    margin-bottom: 16px;
    transition: transform 0.3s;
  }
  .drop-zone:hover .drop-icon { transform: translateY(-4px); }

  /* Orbiting ring icon */
  .orbit-icon {
    width: 72px; height: 72px; margin: 0 auto;
    position: relative;
  }
  .orbit-icon .center {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 28px; height: 28px; border-radius: 50%;
    background: linear-gradient(135deg, var(--indigo), var(--purple));
    box-shadow: 0 0 20px rgba(129,140,248,0.3);
    display: flex; align-items: center; justify-content: center;
  }
  .orbit-icon .ring {
    position: absolute; inset: 0; border-radius: 50%;
    border: 1.5px solid rgba(129,140,248,0.2);
    animation: orbit-spin 6s linear infinite;
  }
  .orbit-icon .ring::after {
    content: ''; position: absolute; top: -3px; left: 50%; transform: translateX(-50%);
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--rose);
    box-shadow: 0 0 8px var(--rose);
  }
  .orbit-icon .ring-2 {
    position: absolute; inset: -8px; border-radius: 50%;
    border: 1px dashed rgba(167,139,250,0.1);
    animation: orbit-spin 10s linear infinite reverse;
  }
  @keyframes orbit-spin { 0% { transform: rotate(0); } 100% { transform: rotate(360deg); } }

  .drop-label { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
  .drop-sub { font-size: 12px; color: var(--text-dim); }
  .drop-sub .browse { color: var(--indigo); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }

  .format-row {
    display: flex; gap: 6px; justify-content: center; margin-top: 16px;
  }
  .format-row span {
    padding: 4px 12px; border-radius: 8px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.02);
    font-size: 10px; font-weight: 600; color: var(--text-dim);
    letter-spacing: 0.1em;
  }

  /* CTA */
  .cta-btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 14px 40px; border: none; border-radius: 14px;
    background: linear-gradient(135deg, var(--indigo), var(--purple));
    color: white; font-size: 14px; font-weight: 700;
    cursor: pointer; transition: all 0.3s;
    box-shadow: 0 0 30px rgba(129,140,248,0.2);
    font-family: 'Space Grotesk', sans-serif;
    letter-spacing: 0.05em;
  }
  .cta-btn:hover { box-shadow: 0 0 50px rgba(129,140,248,0.35); transform: translateY(-1px); }

  /* Bottom labels */
  .bottom-row {
    display: flex; gap: 28px; justify-content: center;
    margin-top: 8px;
  }
  .bottom-row .item {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; color: var(--text-dim);
  }
  .bottom-row .item .dot {
    width: 4px; height: 4px; border-radius: 50%;
  }

  @media (max-width: 640px) {
    .master-card { padding: 32px 24px; }
    .bottom-row { flex-direction: column; align-items: center; gap: 12px; }
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>
<div class="orb-1"></div>
<div class="orb-2"></div>

<nav>
  <div class="nav-inner">
    <a class="logo" href="#">
      <div class="logo-ring">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
          <circle cx="6" cy="6" r="2" fill="#818cf8"/>
          <circle cx="6" cy="6" r="4.5" stroke="#818cf8" stroke-width="0.8" stroke-dasharray="2 2"/>
        </svg>
      </div>
      <span>KORD</span>
    </a>
    <div class="nav-right">Cosmos Engine</div>
  </div>
</nav>

<main>
  <div class="master-card">
    <div class="tag">
      <svg width="8" height="8" viewBox="0 0 8 8" fill="none"><circle cx="4" cy="4" r="2" fill="#818cf8"/></svg>
      AI Mastering
    </div>
    <h1>Upload. Analyze.<br><span class="cosmos">Master.</span></h1>
    <p class="subtitle">Drop your raw mix below and our deep spectral AI engine will deliver streaming-ready masters in seconds.</p>

    <div class="drop-zone" id="dropZone">
      <div class="drop-icon">
        <div class="orbit-icon">
          <div class="ring-2"></div>
          <div class="ring"></div>
          <div class="center">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
              <path d="M6 9V3M6 3L3 6M6 3L9 6" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>
      </div>
      <p class="drop-label">Drop audio file here</p>
      <p class="drop-sub">or <span class="browse">browse files</span></p>
      <div class="format-row">
        <span>WAV</span>
        <span>FLAC</span>
        <span>24-bit</span>
      </div>
    </div>

    <button class="cta-btn">
      Begin Mastering
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M3 7h8M8 4l3 3-3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <div class="bottom-row">
    <div class="item"><div class="dot" style="background:#818cf8;box-shadow:0 0 6px #818cf8"></div> Encrypted Upload</div>
    <div class="item"><div class="dot" style="background:#a78bfa;box-shadow:0 0 6px #a78bfa"></div> Auto-deleted in 10 min</div>
    <div class="item"><div class="dot" style="background:#fb7185;box-shadow:0 0 6px #fb7185"></div> No account required</div>
  </div>
</main>

<script>
// Generate star field
const container = document.getElementById('stars');
for (let i = 0; i < 120; i++) {
  const star = document.createElement('div');
  star.className = 'star';
  star.style.left = Math.random() * 100 + '%';
  star.style.top = Math.random() * 100 + '%';
  star.style.width = star.style.height = (1 + Math.random() * 1.5) + 'px';
  star.style.animationDuration = (2 + Math.random() * 4) + 's';
  star.style.animationDelay = (Math.random() * 3) + 's';
  container.appendChild(star);
}

// Drop zone
const dz = document.getElementById('dropZone');
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('drag-over'); });
</script>
</body>
</html>
